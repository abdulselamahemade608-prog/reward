<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewards</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1b1340;--mut:#6f6a8f;--line:#e8e4fb;--v:#6c4cf1;--pk:#ff5c8a;--mint:#12b886;--sun:#ffb020;--sky:#2d9cff;--red:#f0445b;
--sh:0 1px 2px rgba(27,19,64,.04),0 10px 26px -14px rgba(76,52,170,.28);--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0a26;--card:#1a1340;--ink:#f1eeff;--mut:#a39fc9;--line:#2b2360;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:104px;
background:radial-gradient(60% 38% at 100% 0,color-mix(in srgb,var(--v) 16%,transparent),transparent 70%),radial-gradient(50% 34% at 0 24%,color-mix(in srgb,var(--pk) 11%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{padding:16px;max-width:560px;margin:auto}
.wrap>*{animation:up .4s var(--ease) both}.wrap>*:nth-child(2){animation-delay:.04s}.wrap>*:nth-child(3){animation-delay:.08s}.wrap>*:nth-child(n+4){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0}h2{font-size:18px;font-weight:800;letter-spacing:-.2px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
.top b{font-size:22px;font-weight:800;letter-spacing:-.4px}.top span{color:var(--mut);font-size:13px;display:block}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 24px;color:#fff;background:linear-gradient(135deg,#6c4cf1 0%,#a24cf1 52%,#ff5c8a 100%);box-shadow:0 22px 44px -20px #6c4cf1,inset 0 1px 0 rgba(255,255,255,.25)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:float 7s ease-in-out infinite}
.hero:before{width:200px;height:200px;right:-55px;top:-75px}.hero:after{width:120px;height:120px;right:48px;bottom:-65px;animation-delay:-3s}
@keyframes float{50%{transform:translateY(8px) scale(1.04)}}
.hero small{opacity:.9;font-weight:700;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.6px;font-size:12px}
.hero .n{font-size:68px;font-weight:800;letter-spacing:-3px;line-height:1;margin:10px 0 20px;text-shadow:0 6px 24px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.hero button{position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .2s var(--ease),box-shadow .2s}
.card .ph{width:100%;height:160px;object-fit:cover;border-radius:16px;margin-bottom:12px;display:block}
.noimg{height:116px;border-radius:16px;margin-bottom:12px;display:grid;place-items:center;color:#fff}.noimg svg{width:40px;height:40px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.head{display:flex;gap:12px;align-items:center}
.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 16px -8px rgba(27,19,64,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.g1{background:linear-gradient(135deg,#6c4cf1,#9a7bff)}.g2{background:linear-gradient(135deg,#ff5c8a,#ff8f6b)}
.g3{background:linear-gradient(135deg,#12b886,#4fd6a8)}.g4{background:linear-gradient(135deg,#ffb020,#ffd24d);color:#4a2f00}
.g5{background:linear-gradient(135deg,#2d9cff,#59c2ff)}.g6{background:linear-gradient(135deg,#f0445b,#ff7a8a)}
.mut{color:var(--mut);font-size:13px;white-space:pre-wrap}
button{font:inherit;font-weight:700;border:0;border-radius:15px;padding:12px 18px;background:linear-gradient(135deg,var(--v),#8a63ff);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s var(--ease),box-shadow .2s,filter .2s;box-shadow:0 10px 20px -10px var(--v)}
button:active{transform:scale(.96)}
button.w{background:#fff;color:#4b2fd0;box-shadow:0 10px 20px -12px rgba(0,0,0,.35)}
button.soft{background:color-mix(in srgb,var(--v) 14%,transparent);color:var(--v);box-shadow:none}
button.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);padding:10px;box-shadow:none}
button.ok{background:linear-gradient(135deg,var(--mint),#33d1a0);box-shadow:0 10px 20px -10px var(--mint)}button.full{width:100%}
button:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--sun) 22%,transparent);color:#b36b00;border-radius:99px;padding:4px 11px;font-weight:800;font-size:13px;white-space:nowrap}
@media(prefers-color-scheme:dark){.pill{color:#ffc84d}}
.pill svg{width:14px;height:14px}.st{font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px;text-transform:capitalize}
.st.pending{background:#ffb02033;color:#b36b00}.st.approved{background:#12b88622;color:var(--mint)}.st.rejected{background:#f0445b22;color:var(--red)}
.done{opacity:.6}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--sun),var(--pk));width:0;transition:width .6s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--pk) 50%,transparent)}
.invite{background:linear-gradient(135deg,#12b886,#2d9cff);color:#fff;border:0;box-shadow:0 20px 40px -22px #12b886}.invite .mut{color:#ffffffd9}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;gap:4px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 18px 36px -16px rgba(27,19,64,.45);z-index:5}
nav button{flex:1;flex-direction:column;gap:3px;font-size:11.5px;background:none;color:var(--mut);padding:9px 6px;border-radius:20px;box-shadow:none}
nav button.on{background:linear-gradient(135deg,var(--v),#8a63ff);color:#fff;box-shadow:0 8px 18px -8px var(--v)}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;margin:6px 0 12px;border:1.5px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--bg) 70%,var(--card));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--v);box-shadow:0 0 0 4px color-mix(in srgb,var(--v) 16%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.7}
label{font-size:13px;color:var(--mut);font-weight:700}
#ov{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;overflow:auto;animation:up .3s var(--ease)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:20;display:none;max-width:90%;text-align:center;font-weight:700;box-shadow:0 16px 32px -12px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-12px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
.empty{text-align:center;color:var(--mut);padding:28px 10px;border:1.5px dashed var(--line);border-radius:22px}.empty .ico{margin:0 auto 10px;width:54px;height:54px;border-radius:18px}
.center{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
@media(hover:hover){.card:hover{transform:translateY(-2px)}button:hover{filter:brightness(1.06)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="wrap" id="app"></div><div id="ov"></div><div id="toast"></div><nav id="nav"></nav>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 1 1 0 5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.7 0 4.5 1.8 4.5 4.5"/>',
send:'<path d="M21 3L3 10.5l6.5 2.5L12 20z"/><path d="M9.5 13L21 3"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',ad:'<path d="M3 11v2a1 1 0 0 0 1 1h3l7 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M18 9a4 4 0 0 1 0 6"/>',
set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
out:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',inbox:'<path d="M4 13l2-8h12l2 8v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h5a3 3 0 0 0 6 0h5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const tile=(n,g)=>`<span class="ico ${g}">${ic(n)}</span>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if(!tg||!tg.initData){
  $('#app').innerHTML=`<div class="center"><div>${tile('send','g1').replace('ico','ico" style="width:64px;height:64px;margin:0 auto 16px')}<h2 style="justify-content:center;margin:0 0 6px">Open this app in Telegram</h2><p class="mut">Start the bot and tap the app button. This page does not work in a normal browser.</p></div></div>`;
  throw new Error('Not inside Telegram');
}
tg.ready();tg.expand();
const ref=String(new URLSearchParams(location.search).get('ref')||(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'').replace('ref_','');
async function api(p,m='GET',b){
  const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json','x-init':tg.initData,'x-ref':ref},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong');e.maint=!!j.maintenance;throw e}return j}
function showMaint(m){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="center"><div><span class="ico g4" style="width:64px;height:64px;margin:0 auto 16px">${ic('set')}</span><h2 style="justify-content:center;margin:0 0 8px">Under maintenance</h2><p class="mut">${esc(m)}</p><button onclick="location.reload()">Try again</button></div></div>`}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2800)}
const run=async f=>{try{await f()}catch(e){e.maint?showMaint(e.message):toast(e.message)}};
const open=u=>/^https:\/\/t\.me\//.test(u)?tg.openTelegramLink(u):tg.openLink(u);
const GR=['g1','g2','g3','g4','g5'];
const img=(id,i=0,icon='gift')=>id?`<img class="ph" src="/img/${id}" alt="">`:`<div class="noimg ${GR[i%5]}">${ic(icon)}</div>`;
let S={},A=null,PR=null,tab='home',first=true;

async function load(){S=await api('home');if(tab==='admin')A=await api('admin/data');if(tab==='profile')PR=await api('profile');render();
  if(first&&tab==='home'){first=false;const e=$('.hero .n');if(e){const to=S.points,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);e.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}}}
function render(){
  $('#nav').innerHTML=[['home','Home','home'],['tasks','Tasks','tasks'],['profile','Profile','user'],...(S.admin?[['admin','Admin','shield']]:[])].map(([k,l,i])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';run(load)">${ic(i)}${l}</button>`).join('');
  $('#app').innerHTML=tab==='home'?home():tab==='tasks'?tasks():tab==='profile'?profile():admin();scrollTo(0,0)}
const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
const board=(t,i,g,rows,val)=>`<h2>${tile(i,g)} ${t}</h2>`+(rows.length?`<div class="card" style="padding:4px 14px">`+rows.map((u,k)=>`<div class="row" style="padding:11px 0;${k?'border-top:1px solid var(--line)':''}"><div class="head"><b style="min-width:34px">${medal(k)}</b><b>${esc(u.name||'User')}${String(u.id)===String(S.me)?' (you)':''}</b></div><span class="pill">${val(u)}</span></div>`).join('')+`</div>`:`<div class="empty">${tile(i,g)}No one yet.<br>Be the first!</div>`);
function checkin(){const c=S.checkin;if(!c)return '';const pts=n=>c.base+(Math.min(n,c.max)-1)*c.step;
  const ref=c.done_today?c.streak:c.streak+1,b0=Math.floor((Math.max(ref,1)-1)/7)*7+1;
  const days=[0,1,2,3,4,5,6].map(i=>b0+i).map(d=>{const done=d<=c.streak,now=!c.done_today&&d===c.streak+1;
    const st=done?'background:var(--mint);color:#fff':now?'background:var(--sun);color:#fff':'background:var(--bg);border:1.5px solid var(--line)';
    return `<div style="flex:1;text-align:center"><div style="aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;${st}">${done?'✓':'+'+pts(d)}</div><div class="mut" style="font-size:10px;margin-top:4px">Day ${d}</div></div>`}).join('');
  return `<div class="card"><div class="head">${tile('star','g4')}<div><b style="font-size:17px">Daily check-in</b><div class="mut">🔥 ${c.streak} day streak</div></div></div>
<div class="row" style="gap:6px;margin:14px 0">${days}</div>
<button class="full ${c.done_today?'soft':'ok'}" ${c.done_today?'disabled':''} onclick="run(doCheckin)">${c.done_today?'Come back tomorrow for +'+pts(c.streak+1):'Check in +'+pts(c.streak+1)}</button></div>`}
async function doCheckin(){const r=await api('checkin','POST');toast('+'+r.points+' points! 🔥 '+r.streak+' day streak');await load()}
const promoCard=()=>`<div class="card"><div class="head">${tile('gift','g3')}<div><b style="font-size:17px">Promo code</b><div class="mut">Got a code from our channel? Enter it here.</div></div></div>
<div class="row" style="gap:8px;margin-top:12px"><input id="pc" placeholder="CODE" autocapitalize="characters" style="margin:0;flex:1;text-transform:uppercase"><button onclick="run(redeem)">Redeem</button></div></div>`;
async function redeem(){const r=await api('promo','POST',{code:v('pc')});toast('+'+r.points+' points!');await load()}
function home(){return `
<div class="top"><div><span>Welcome back</span><b>${esc(tg.initDataUnsafe.user?.first_name||'Friend')}</b></div></div>
${S.maintenance?`<div class="card" style="border-color:var(--red)"><b>Maintenance mode is ON</b><div class="mut">Only admins can use the app right now.</div></div>`:''}
<div class="hero"><small>${ic('star')} Your points</small><div class="n">${S.points}</div>${S.ad_pending?`<button class="w" onclick="run(collectAd)">${ic('star')} Collect 1 point</button> <button style="background:#ffffff33;color:#fff" onclick="run(watch)">${ic('play')} Open ad again</button>`:`<button class="w" onclick="run(watch)">${ic('play')} Watch an ad, get 1 point</button>`}
<div style="position:relative;z-index:1;margin-top:12px;font-size:12px;opacity:.9">Ads today: ${S.ads_today} / ${S.ad_limit}</div></div>
${checkin()}
${promoCard()}
<h2>${tile('gift','g2')} Rewards</h2>
${(S.rewards||[]).length?(S.rewards||[]).map((r,i)=>{const mi=r.min_invites||0,np=Math.max(0,r.cost-S.points),ni=Math.max(0,mi-S.invites),ok=!np&&!ni,pc=Math.min(100,S.points/r.cost*100),pi=mi?Math.min(100,S.invites/mi*100):100;
const lbl=ok?ic('gift')+' Claim reward':[np?np+' more points':'',ni?ni+' more invites':''].filter(Boolean).join(' + ')+' needed';
return `<div class="card">${img(r.image_id,i)}
<div class="row"><b style="font-size:16px">${esc(r.title)}</b><span><span class="pill">${ic('star')}${r.cost}</span>${mi?` <span class="pill">${ic('users')}${mi}</span>`:''}</span></div>
<div class="mut" style="margin-top:4px">${esc(r.body)}</div>
<div class="mut" style="margin-top:8px">Points ${Math.min(S.points,r.cost)} / ${r.cost}</div><div class="bar"><i style="width:${pc}%"></i></div>
${mi?`<div class="mut">Invites ${Math.min(S.invites,mi)} / ${mi}</div><div class="bar"><i style="width:${pi}%"></i></div>`:''}
<button class="full ${ok?'ok':'soft'}" ${ok?'':'disabled'} onclick="run(()=>claim(${r.id}))">${lbl}</button></div>`}).join('')
:`<div class="empty">${tile('gift','g2')}No rewards yet.<br>Check back soon.</div>`}
${board('Top points','star','g4',S.top_points||[],u=>u.points+' pts')}`}
function tasks(){
  const link=`https://t.me/${S.bot}?start=ref_${S.me}`;
  return `<div class="card invite"><div class="head">${tile('users','g6').replace('g6','')} <div><b style="font-size:17px">Invite friends</b><div class="mut">Earn ${S.invite_points} points for every friend who joins with your link.<br>You invited <b>${S.invites}</b> friend(s) so far.</div></div></div>
<div class="row" style="margin-top:14px"><button class="w full" onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('${link}'))">${ic('share')} Share</button>
<button class="w full" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copied'))">${ic('copy')} Copy</button></div></div>
${board('Top inviters','users','g3',S.top_invites||[],u=>u.invites+' invites')}
<h2>${tile('tasks','g1')} Tasks</h2>
${(S.tasks||[]).length?(S.tasks||[]).map((t,i)=>`<div class="card ${t.done?'done':''}">${t.image_id?img(t.image_id):''}
<div class="head">${tile(t.type==='join'?'send':'bot',t.type==='join'?'g5':'g1')}<div style="flex:1"><b>${esc(t.title)}</b><div class="mut">${esc(t.body)}</div></div><span class="pill">${ic('star')}${t.points}</span></div>
<div class="row" style="margin-top:12px">${t.done?`<span class="st approved" style="display:inline-flex;gap:4px;align-items:center">${ic('check').replace('<svg','<svg width=14 height=14')} Completed</span>`:`
<button class="soft full" onclick="open('${esc(t.link)}')">${ic('out')} ${t.type==='join'?'Join channel':'Open bot'}</button>
<button class="full" onclick="run(()=>doTask(${t.id}))">${ic('check')} ${t.type==='join'?'Verify':'I did it'}</button>`}</div></div>`).join('')
:`<div class="empty">${tile('tasks','g1')}No tasks yet.<br>Check back soon.</div>`}`}
function profile(){if(!PR)return '<p class="mut">Loading...</p>';const p=PR,uu=(tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
  const row=(k,v)=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><span class="mut">${k}</span><b>${v}</b></div>`;
  const link=`https://t.me/${S.bot}?start=ref_${S.me}`;
  return `<div class="top"><div><span>My account</span><b>Profile</b></div></div>
<div class="card" style="text-align:center"><div style="position:relative;width:88px;height:88px;margin:6px auto 12px;border-radius:50%;background:linear-gradient(135deg,#6c4cf1,#ff5c8a);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;overflow:hidden">${esc((p.name||'U').trim().charAt(0).toUpperCase())}${uu.photo_url?`<img src="${esc(uu.photo_url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:''}</div>
<b style="font-size:19px">${esc(p.name)}</b><div class="mut">${p.username?'@'+esc(p.username):'No username'}</div></div>
<div class="row" style="gap:10px;margin-bottom:12px">${stat(p.points,'Points','g4','star')}${stat(p.invites,'Invites','g3','users')}</div>
<div class="card" style="padding:4px 14px">${row('Name',esc(p.name))}${row('Username',p.username?'@'+esc(p.username):'-')}${row('Telegram ID',esc(p.id))}${row('Joined',new Date(p.created_at).toLocaleDateString())}
${row('Points rank','#'+p.rank_points)}${row('Invites rank',p.invites?'#'+p.rank_invites:'-')}${row('Ads today',p.ads_today+' / '+S.ad_limit)}${row('Ads watched (total)',p.ads_total)}${row('Tasks completed',p.tasks_done)}${row('Invited by',p.invited_by_name?esc(p.invited_by_name):'-')}</div>
<div class="card invite"><b>My invite link</b><div class="mut" style="word-break:break-all;margin:6px 0 12px">${link}</div>
<div class="row"><button class="w full" onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('${link}'))">${ic('share')} Share</button>
<button class="w full" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copied'))">${ic('copy')} Copy</button></div></div>
<h2>${tile('inbox','g4')} My claims</h2>${(p.claims||[]).length?p.claims.map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="pill">${ic('star')}${c.cost}</span></div><div class="row" style="margin-top:8px"><span class="st ${c.status}">${c.status}</span><span class="mut">${new Date(c.created_at).toLocaleDateString()}</span></div></div>`).join(''):`<div class="empty">${tile('inbox','g4')}No claims yet.</div>`}`}
async function claim(id){await api('reward/'+id+'/claim','POST');await load();contact()}
function contact(){const o=$('#ov');o.style.display='block';
  o.innerHTML=`<div class="center"><div><span class="ico g3" style="width:64px;height:64px;margin:0 auto 16px">${ic('gift')}</span><h2 style="justify-content:center;margin:0 0 8px">Claim sent!</h2>
<p class="mut">To receive your reward, contact the admin:<br><b style="font-size:17px;color:var(--ink)">@${esc(S.owner)}</b></p>
<button class="full" onclick="tg.openTelegramLink('https://t.me/${esc(S.owner)}')">${ic('send')} Contact @${esc(S.owner)}</button>
<button class="soft full" style="margin-top:10px" onclick="$('#ov').style.display='none'">Close</button></div></div>`}
async function doTask(id){const r=await api('task/'+id,'POST');toast('+'+r.points+' points');await load()}
async function watch(){
  const r=await api('ad/start','POST');
  await load();
  toast('Watch the ad in the bot, then come back and collect your point');
  open(r.link)}
async function collectAd(){await api('ad/done','POST');toast('+1 point');await load()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='home')run(load)});

// ---------- Admin ----------
function upImg(id){const f=$('#'+id).files[0];if(!f)return null;
  return new Promise(res=>{const im=new Image();im.onload=async()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res((await api('admin/image','POST',{data:c.toDataURL('image/jpeg',.8).split(',')[1]})).id)};im.src=URL.createObjectURL(f)})}
const v=id=>$('#'+id).value;
const del=(k,id)=>run(async()=>{await api('admin/'+k+'/'+id,'DELETE');await load()});
const add=(k,body)=>run(async()=>{await api('admin/'+k,'POST',body);toast('Saved');await load()});
const addReward=()=>run(async()=>add('reward',{title:v('rt'),body:v('rb'),cost:v('rc'),min_invites:v('rm'),image_id:await upImg('ri')}));
const addTask=()=>run(async()=>add('task',{type:v('tk'),title:v('tt'),body:v('tb'),channel:v('tch'),link:v('tl'),points:v('tp'),image_id:await upImg('ti')}));
const saveSet=()=>add('settings',{ad_seconds:v('s1'),invite_points:v('s2'),daily_ad_limit:v('s3'),ad_confirm:v('s4'),checkin_base:v('s5'),checkin_step:v('s6'),checkin_max:v('s7'),maintenance:v('s8'),maintenance_msg:v('mmsg')});
const addPromo=()=>run(async()=>{const r=await api('admin/promo','POST',{code:v('pcode'),points:v('ppts'),max_uses:v('pmax'),hours:v('phrs')});toast('Code created: '+r.code);await load()});
const askYes=m=>new Promise(r=>tg.showConfirm?tg.showConfirm(m,r):r(confirm(m)));
async function sendBroadcast(){const text=v('bt').trim();if(!text)throw new Error('Write a message first');
  if(!await askYes('Send this message to ALL users?'))return;
  const r=await api('admin/broadcast','POST',{text,button:$('#bb').checked}),st=$('#bst');
  for(;;){const b=await api('admin/broadcast/'+r.id+'/step','POST',{});
    st.textContent='Sending... '+(Number(b.sent)+Number(b.failed))+' / '+b.total;
    if(b.status==='done'){st.textContent='Done. Sent '+b.sent+', failed '+b.failed+' (failed = users who blocked the bot or never started it)';await load();break}
    await new Promise(z=>setTimeout(z,(b.wait||1)*1000))}}
const act=(id,st)=>run(async()=>{await api('admin/claim/'+id,'POST',{status:st});await load()});
const list=(k,a,g,i)=>a.map(x=>`<div class="card row" style="padding:10px 12px">${tile(i,g)}<span style="flex:1;font-weight:700">${esc(x.title)}</span><button class="bad" onclick="del('${k}',${x.id})">${ic('trash')}</button></div>`).join('');
function tkChange(){const j=v('tk')==='join';$('#tchw').style.display=j?'block':'none';$('#tlw').style.display=j?'none':'block'}
const stat=(n,l,g,i)=>`<div class="card head" style="flex:1;margin:0">${tile(i,g)}<div><b style="font-size:20px">${n}</b><div class="mut">${l}</div></div></div>`;
function admin(){if(!A)return '<p class="mut">Loading...</p>';const s=A.settings,pend=(A.claims||[]).filter(c=>c.status==='pending').length;return `
<div class="top"><div><span>Control center</span><b>Admin</b></div></div>
<div class="row" style="gap:10px">${stat(A.users,'Users','g5','users')}${stat(pend,'Pending claims','g4','inbox')}</div>
<h2>${tile('inbox','g4')} Reward claims</h2>${(A.claims||[]).length?(A.claims||[]).map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="pill">${ic('star')}${c.cost}</span></div>
<div class="mut">${esc(c.name)} ${c.username?'@'+esc(c.username):''} (ID ${c.user_id})</div>
${c.status==='pending'?`<div class="row" style="margin-top:10px"><button class="ok full" onclick="act(${c.id},'approved')">${ic('check')} Approve</button><button class="bad full" onclick="act(${c.id},'rejected')">${ic('x')} Reject</button></div>`:`<div style="margin-top:8px"><span class="st ${c.status}">${c.status}</span></div>`}</div>`).join(''):`<div class="empty">${tile('inbox','g4')}No claims yet.</div>`}
<h2>${tile('gift','g2')} Add reward</h2><div class="card"><label>Title</label><input id="rt"><label>Description</label><textarea id="rb" rows="3"></textarea>
<label>Points needed</label><input id="rc" type="number" min="1"><label>Invites needed (0 = no invites needed)</label><input id="rm" type="number" min="0" value="0"><label>Photo</label><input id="ri" type="file" accept="image/*"><button class="full" onclick="addReward()">${ic('plus')} Save reward</button></div>${list('reward',A.rewards||[],'g2','gift')}
<h2>${tile('tasks','g1')} Add task</h2><div class="card"><label>Task type</label><select id="tk" onchange="tkChange()"><option value="join">Join a channel</option><option value="bot">Open a bot (photo task)</option></select>
<label>Title</label><input id="tt"><label>How it works</label><textarea id="tb" rows="3"></textarea>
<div id="tchw"><label>Channel username (the bot must be admin there)</label><input id="tch" placeholder="@mychannel"></div>
<div id="tlw" style="display:none"><label>Bot link</label><input id="tl" placeholder="https://t.me/somebot"></div>
<label>Points</label><input id="tp" type="number" min="1" value="5"><label>Photo (optional)</label><input id="ti" type="file" accept="image/*">
<button class="full" onclick="addTask()">${ic('plus')} Save task</button></div>${list('task',A.tasks||[],'g1','tasks')}
<h2>${tile('send','g1')} Broadcast</h2><div class="card"><label>Message to all users</label><textarea id="bt" rows="4" maxlength="3500"></textarea>
<label style="display:flex;gap:8px;align-items:center"><input id="bb" type="checkbox" checked style="width:auto;margin:0"> Add an "Open app" button</label>
<button class="full" style="margin-top:12px" onclick="run(sendBroadcast)">${ic('send')} Send to everyone</button><div id="bst" class="mut" style="margin-top:10px"></div>
${(A.broadcasts||[]).map(b=>`<div class="mut" style="margin-top:6px">${new Date(b.created_at).toLocaleString()}: sent ${b.sent}, failed ${b.failed} / ${b.total}${b.status==='done'?'':' (not finished)'}</div>`).join('')}</div>
<h2>${tile('gift','g2')} Promo codes</h2><div class="card"><label>Code (leave empty for a random one)</label><input id="pcode" autocapitalize="characters" style="text-transform:uppercase">
<label>Points</label><input id="ppts" type="number" min="1" value="10"><label>Max uses (0 = unlimited)</label><input id="pmax" type="number" min="0" value="0">
<label>Expires after hours (0 = never)</label><input id="phrs" type="number" min="0" value="0"><button class="full" onclick="addPromo()">${ic('plus')} Create code</button></div>
${(A.promos||[]).map(p=>`<div class="card row" style="padding:10px 12px"><div style="flex:1"><b>${esc(p.code)}</b><div class="mut">+${p.points} pts · used ${p.used}${p.max_uses?' / '+p.max_uses:''}${p.expires_at?' · expires '+new Date(p.expires_at).toLocaleString():''}</div></div>
<button onclick="navigator.clipboard.writeText('${esc(p.code)}').then(()=>toast('Copied'))">${ic('copy')}</button><button class="bad" onclick="del('promo',${p.id})">${ic('trash')}</button></div>`).join('')}
<h2>${tile('set','g3')} Settings</h2><div class="card"><label>Seconds to watch an ad</label><input id="s1" type="number" value="${s.ad_seconds}">
<label>Points for each invited friend</label><input id="s2" type="number" value="${s.invite_points}">
<label>Max ads per user per day</label><input id="s3" type="number" value="${s.daily_ad_limit}"><label>Require ad confirmation from the bot (1 = yes, 0 = no)</label><input id="s4" type="number" min="0" max="1" value="${s.ad_confirm}"><label>Check-in: points for day 1</label><input id="s5" type="number" value="${s.checkin_base}"><label>Check-in: extra points for each next day</label><input id="s6" type="number" value="${s.checkin_step}">
<label>Check-in: bonus stops growing after day</label><input id="s7" type="number" min="1" value="${s.checkin_max}">
<label>Maintenance mode</label><select id="s8"><option value="0" ${s.maintenance?'':'selected'}>Off</option><option value="1" ${s.maintenance?'selected':''}>ON - users see the message below</option></select>
<label>Maintenance message</label><textarea id="mmsg" rows="3">${esc(s.maintenance_msg)}</textarea>
<button class="full ok" onclick="saveSet()">${ic('check')} Save settings</button></div>`}
load().catch(e=>{if(e.maint)return showMaint(e.message);$('#app').innerHTML=`<div class="center"><div><h2 style="justify-content:center">Could not load</h2><p class="mut">${esc(e.message)}</p><button onclick="location.reload()">Try again</button></div></div>`});
</script></body></html>
